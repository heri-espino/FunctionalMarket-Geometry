[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "functional-market-geometry"
version = "0.1.0"
description = "Exploratory Hilbert-space distances and time-varying financial-market geometry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "sphinx>=7,<10", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/market_geometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
