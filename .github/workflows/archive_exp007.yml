name: Archive EXP-007 synthetic results
on:
  push:
    branches: [main]
    paths:
      - 'src/market_geometry/similarity_targets.py'
      - 'market_geometry/notes/007-similarity_targets/README.md'
      - 'market_geometry/code/007-similarity_targets/run.py'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Reproduce and archive EXP-007 with 100 seeds
        run: python market_geometry/code/007-similarity_targets/run.py --publish --seeds 100 --length 128 --seed-start 42000
      - run: python scripts/validate_research.py
      - name: Commit experiment artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_geometry/notes/007-similarity_targets \
                  market_geometry/results/007-similarity_targets \
                  market_geometry/figures/007-similarity_targets
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Archive EXP-007 synthetic market similarity results"
            git push origin HEAD:main
          fi
